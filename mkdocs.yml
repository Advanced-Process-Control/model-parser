site_name: apc-model-parser
site_description: Canonical IR for process-model scaffolds — parse, validate, codegen
site_url: https://advanced-process-control.github.io/model-parser/
repo_url: https://github.com/Advanced-Process-Control/model-parser
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false

nav:
  - Home: index.md
  - CLI and generated views: cli.md
  - IR specification: design/ir-specification.md
  - Model library & versioning: design/model-library-and-versioning.md
  - API reference: api.md
  - Deployment: deployment/ci-cd.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
